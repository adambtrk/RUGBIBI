{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <title>{% block title %}RugbyVision AI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
</head>
<body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div class="site-shell">
        <header class="site-header">
            <a class="wordmark" href="{% url 'core:home' %}" aria-label="RugbyVision AI — Accueil">rugbyvision<span class="brand-dot" aria-hidden="true">.</span></a>
            <nav aria-label="Navigation principale">
                {% if user.is_authenticated %}
                    <span class="account-name">{{ user.get_short_name|default:user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="nav-link" type="submit">Déconnexion</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Connexion <span aria-hidden="true">↗</span></a>
                {% endif %}
            </nav>
        </header>
        <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
        <footer class="site-footer"><span>RugbyVision AI</span><span>Au plus près du jeu.</span></footer>
    </div>
</body>
</html>
